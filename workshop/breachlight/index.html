<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breachlight has moved · breach.labidi.eu</title>
    <meta name="description"
        content="Breachlight — what to do the moment after you clicked — now lives at breach.labidi.eu.">
    <meta name="theme-color" content="#0a0c12">
    <meta name="robots" content="noindex, follow">

    <!--
      Breachlight moved out of the workshop and onto its own domain.

      This page keeps every old link working, including deep ones. The site is
      a single page with hash routes, and a fragment is never sent to the
      server — so the redirect is done in JavaScript, which CAN see it, and
      the whole "#/play/entered-password" part is carried across. The
      canonical tag and the meta refresh cover crawlers and anyone with
      JavaScript off.

      The old service worker here was network-first, so most returning
      visitors reach this page naturally. sw.js in this folder is now a
      tombstone that clears the old caches and unregisters itself, for the
      installed-app and offline cases; the script below does the same from
      the page side.
    -->
    <link rel="canonical" href="https://breach.labidi.eu/">
    <meta http-equiv="refresh" content="0; url=https://breach.labidi.eu/">
    <script>
        (function () {
            'use strict';
            var TARGET = 'https://breach.labidi.eu/';

            /* Tear down anything the old installation left behind, so a
               returning visitor is not trapped on a cached copy. */
            try {
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.getRegistrations().then(function (rs) {
                        rs.forEach(function (r) { r.unregister(); });
                    }).catch(function () { });
                }
                if (window.caches && caches.keys) {
                    caches.keys().then(function (keys) {
                        keys.forEach(function (k) { caches.delete(k); });
                    }).catch(function () { });
                }
            } catch (e) { /* nothing here is worth blocking the redirect for */ }

            /* Carry the hash route across, so a bookmark to a specific
               playbook, term or triage tree lands exactly where it did. */
            location.replace(TARGET + (location.hash || ''));
        })();
    </script>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #0a0c12;
            color: #e8e3d8;
            font: 1rem/1.6 system-ui, sans-serif;
            text-align: center;
            padding: 1.5rem;
        }

        a {
            color: #ffb347;
        }
    </style>
</head>

<body>
    <p>🔦 Breachlight now lives at
        <a href="https://breach.labidi.eu/"><b>breach.labidi.eu</b></a>
        — taking you there.
    </p>
</body>

</html>
