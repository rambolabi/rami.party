<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The People Library has moved — library.labidi.eu</title>
  <meta name="description" content="The People Library now lives at library.labidi.eu." />

  <!-- GitHub Pages cannot issue a 301, so this is the standard static stand-in:
       a canonical pointing at the new home tells crawlers where the content
       went, robots noindex keeps this stub out of the index, and the meta
       refresh moves real visitors. -->
  <link rel="canonical" href="https://library.labidi.eu/" />
  <meta name="robots" content="noindex, follow" />
  <meta http-equiv="refresh" content="0; url=https://library.labidi.eu/" />

  <meta name="theme-color" content="#7c3aed" />
  <meta name="color-scheme" content="light" />
  <style>
    :root{ --ink:#14181f; --ink-2:#3b4453; --accent:#7c3aed; --bg:#f6f8fc; }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
      color:var(--ink);background:var(--bg);line-height:1.65;
      min-height:100vh;display:grid;place-items:center;padding:2rem 1.25rem;text-align:center;
    }
    .dots{display:inline-flex;gap:7px;margin-bottom:22px}
    .dots i{width:14px;height:14px;border-radius:50%;display:inline-block}
    h1{font-family:Georgia,serif;font-weight:900;font-size:clamp(1.4rem,4.5vw,2rem);
       letter-spacing:-.02em;line-height:1.15;margin-bottom:12px}
    p{color:var(--ink-2);margin-bottom:24px}
    a.btn{display:inline-block;background:var(--accent);color:#fff;font-weight:600;
      padding:13px 26px;border-radius:999px;text-decoration:none;
      box-shadow:0 8px 22px rgba(124,58,237,.35)}
    a.btn:hover{background:#6d28d9}
    .back{display:block;margin-top:26px;font-size:.85rem;color:#6b7688}
    .back a{color:var(--ink-2)}
  </style>
</head>
<body>
  <main>
    <span class="dots" aria-hidden="true">
      <i style="background:#e63946"></i><i style="background:#f0a500"></i>
      <i style="background:#2a9d5c"></i><i style="background:#2e6fd6"></i>
    </span>
    <h1>The People Library has moved.</h1>
    <p>It now has a home of its own at <strong>library.labidi.eu</strong>.</p>
    <p><a class="btn" href="https://library.labidi.eu/">Go to The People Library →</a></p>
    <p class="back"><a href="../../index.html">← back to rami.party</a></p>
  </main>
</body>
</html>
