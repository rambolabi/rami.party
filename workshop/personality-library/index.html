<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>The People Library — Understand yourself and everyone around you</title>
  <meta name="description" content="A library of interactive workshops on personality, behaviour, communication and difficult people — DISC, Big Five, MBTI, Enneagram, attachment, love languages, and Thomas Erikson's 'Surrounded by…' series. If you want to know it, there's a workshop for it." />
  <meta name="author" content="rami.party" />
  <meta name="theme-color" content="#7c3aed" />
  <meta name="color-scheme" content="light" />
  <meta property="og:title" content="The People Library" />
  <meta property="og:description" content="Interactive workshops to make you genuinely knowledgeable about personality, behaviour and how to treat everyone around you." />
  <meta property="og:type" content="website" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://rami.party/workshop/personality-library/" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --ink:#14181f; --ink-2:#3b4453; --muted:#6b7688; --line:#e6e9f0;
      --bg:#f6f8fc; --card:#fff; --card-2:#fbfcfe; --accent:#7c3aed;
      --radius:18px; --radius-sm:12px;
      --shadow-sm:0 1px 2px rgba(20,24,31,.05),0 4px 14px rgba(20,24,31,.05);
      --shadow-md:0 10px 30px rgba(20,24,31,.09);
      --ease:cubic-bezier(.22,1,.36,1);
      --display:"Fraunces",Georgia,serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
      --gutter:2.5rem; --nav-h:64px; --tap:44px;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav-h) + 12px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
    body{font-family:var(--body);color:var(--ink);background:var(--bg);line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden;overflow-wrap:break-word}
    h1,h2,p,b,small,span{overflow-wrap:break-word}
    a{color:inherit;text-decoration:none}
    :focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
    @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
    .wrap{width:min(1140px,100% - var(--gutter));margin-inline:auto}
    .skip-link{position:absolute;left:-999px;top:0;background:var(--accent);color:#fff;padding:10px 16px;border-radius:0 0 10px 0;z-index:200}
    .skip-link:focus{left:0}

    /* Top bar */
    .topbar{position:sticky;top:0;z-index:50;background:rgba(246,248,252,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-inline:env(safe-area-inset-left) env(safe-area-inset-right)}
    .nav{display:flex;align-items:center;justify-content:space-between;gap:.75rem;min-height:var(--nav-h);width:min(1140px,100% - var(--gutter));margin-inline:auto}
    .brand{display:inline-flex;align-items:center;gap:10px;font-family:var(--display);font-weight:900;font-size:1.08rem;min-width:0}
    .brand i{width:10px;height:10px;border-radius:50%;display:inline-block}
    .brand .dots{display:inline-flex;gap:4px;flex:none}
    .brand .brand-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .nav-right{display:flex;align-items:center;gap:10px;min-width:0}
    .nav-links{display:flex;gap:4px;flex-wrap:wrap;list-style:none}
    .nav-links a{display:block;font-weight:600;font-size:.88rem;color:var(--ink-2);padding:7px 11px;border-radius:9px}

    /* Language switcher */
    .lang-switch{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--card-2);flex:none}
    .lang-switch button{border:0;background:none;border-radius:999px;padding:6px 9px;font-family:var(--body);font-weight:700;font-size:.74rem;letter-spacing:.04em;color:var(--muted);cursor:pointer;line-height:1;transition:background .2s var(--ease),color .2s var(--ease)}
    .lang-switch button.on{background:var(--accent);color:#fff}

    /* Hero */
    .hero{position:relative;text-align:center;padding:clamp(44px,9vw,110px) 0 clamp(36px,6vw,72px);overflow:hidden;
      background:radial-gradient(50% 55% at 15% 0%,rgba(230,57,70,.10),transparent 60%),
                 radial-gradient(50% 55% at 50% 0%,rgba(240,165,0,.10),transparent 60%),
                 radial-gradient(50% 55% at 85% 0%,rgba(46,111,214,.12),transparent 60%),
                 radial-gradient(50% 55% at 70% 100%,rgba(124,58,237,.10),transparent 60%)}
    .eyebrow{text-transform:uppercase;letter-spacing:.22em;font-size:.74rem;font-weight:700;color:#6d28d9;margin-bottom:18px}
    .hero h1{font-family:var(--display);font-weight:900;font-size:clamp(2rem,7vw,4.6rem);line-height:1.05;letter-spacing:-.02em;margin-bottom:20px;text-wrap:balance}
    .hero p.lead{max-width:660px;margin:0 auto 30px;font-size:clamp(1rem,2.2vw,1.24rem);color:var(--ink-2);text-wrap:pretty}
    .hero .lead em{font-style:italic;color:var(--ink)}
    .cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--body);font-weight:600;font-size:.96rem;min-height:var(--tap);padding:12px 22px;border-radius:999px;border:1.5px solid transparent;cursor:pointer;text-align:center;line-height:1.3;transition:transform .2s var(--ease),box-shadow .2s var(--ease),background .2s var(--ease),border-color .2s var(--ease)}
    .btn-primary{background:var(--accent);color:#fff;box-shadow:0 8px 22px rgba(124,58,237,.35)}
    .btn-ghost{background:var(--card);border-color:var(--line);box-shadow:var(--shadow-sm)}
    .stat-row{display:flex;gap:clamp(18px,5vw,28px);justify-content:center;flex-wrap:wrap;margin-top:42px}
    .stat b{font-family:var(--display);font-weight:900;font-size:1.8rem;display:block;line-height:1}
    .stat span{font-size:.78rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.07em}

    /* Groups */
    .group{padding:clamp(36px,6vw,68px) 0}
    .group:nth-of-type(even){background:var(--card);border-block:1px solid var(--line)}
    .group-head{max-width:720px;margin:0 auto clamp(22px,4vw,40px);text-align:center}
    .group-kicker{text-transform:uppercase;letter-spacing:.16em;font-size:.72rem;font-weight:700;color:var(--muted);margin-bottom:8px}
    .group-head h2{font-family:var(--display);font-weight:900;font-size:clamp(1.5rem,4vw,2.5rem);letter-spacing:-.02em;line-height:1.12;margin-bottom:12px;text-wrap:balance}
    .group-head p{color:var(--ink-2);font-size:clamp(.98rem,2vw,1.03rem);text-wrap:pretty}
    .group-head em{font-style:italic;color:var(--ink)}

    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:16px}
    .lib-card{--c:var(--accent);display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow-sm);transition:transform .22s var(--ease),box-shadow .22s var(--ease),border-color .22s var(--ease)}
    .group:nth-of-type(even) .lib-card{background:var(--card-2)}
    .lib-emoji{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:1.7rem;background:color-mix(in srgb,var(--c) 14%,transparent)}
    .lib-body{flex:1;min-width:0}
    .lib-body b{display:block;font-family:var(--display);font-weight:800;font-size:1.1rem;color:var(--ink);margin-bottom:3px;line-height:1.25}
    .lib-body small{color:var(--ink-2);font-size:.92rem;line-height:1.5;display:block}
    .lib-tag{display:inline-block;margin-top:8px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--c)}
    .lib-go{flex:none;color:var(--c);font-weight:800;font-size:1.3rem;transition:transform .2s var(--ease)}
    .start-here{border:1.5px dashed color-mix(in srgb,var(--c) 55%,var(--line));border-left:5px solid var(--c)}
    .start-here .lib-tag::before{content:"★ "}

    /* Footer */
    .footer{background:var(--ink);color:#c7cfdd;padding:44px 0 calc(44px + env(safe-area-inset-bottom));text-align:center}
    .footer .fnote{max-width:640px;margin:0 auto 12px;font-size:.9rem;line-height:1.6}
    .footer em{font-style:italic;color:#fff}
    .footer .fmeta{font-size:.84rem;color:#8b95a8}
    .footer .fmeta a{color:#fff}

    @media (hover:hover) and (pointer:fine){
      .nav-links a:hover{background:rgba(124,58,237,.1);color:#6d28d9}
      .lang-switch button:hover{color:var(--ink)}
      .lang-switch button.on:hover{color:#fff}
      .btn-primary:hover{background:#6d28d9;transform:translateY(-2px)}
      .btn-ghost:hover{transform:translateY(-2px);border-color:#c4b5fd}
      .lib-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-md);border-color:var(--c)}
      .lib-card:hover .lib-go{transform:translateX(4px)}
      .footer .fmeta a:hover{text-decoration:underline}
    }

    @media (max-width:900px){:root{--gutter:2rem}.nav-links{display:none}}
    @media (max-width:640px){:root{--gutter:1.75rem}.cta .btn{flex:1 1 100%}}
    @media (max-width:400px){
      :root{--gutter:1.25rem}
      body{font-size:15.5px}
      .brand .brand-text{max-width:11ch}
      .lang-switch{padding:2px}.lang-switch button{padding:6px 7px;font-size:.68rem}
      .lib-card{padding:18px;gap:13px}
      .lib-emoji{width:44px;height:44px;font-size:1.45rem;border-radius:12px}
      .lib-go{display:none}
      .stat b{font-size:1.5rem}
    }
    @media (max-width:340px){.brand .brand-text{display:none}}

    @media print{
      .topbar,.cta,.lang-switch,.stat-row,.skip-link{display:none!important}
      body{background:#fff}
      .group,.group:nth-of-type(even){background:#fff;border:0;padding:10px 0}
      .lib-card{box-shadow:none;break-inside:avoid}
      *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#top" data-i18n="skip">Skip to content</a>

  <header class="topbar">
    <nav class="nav" aria-label="Primary">
      <a class="brand" href="#top">
        <span class="dots" aria-hidden="true"><i style="background:#e63946"></i><i style="background:#f0a500"></i><i style="background:#2a9d5c"></i><i style="background:#2e6fd6"></i></span>
        <span class="brand-text" data-i18n="brand">The People Library</span>
      </a>
      <div class="nav-right">
        <ul class="nav-links" id="navLinks"></ul>
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="nl">NL</button>
          <button type="button" data-lang="fr">FR</button>
        </div>
      </div>
    </nav>
  </header>

  <main id="top">
    <section class="hero">
      <div class="wrap">
        <p class="eyebrow" data-i18n="hero_eyebrow"></p>
        <h1 data-i18n-html="hero_title"></h1>
        <p class="lead" data-i18n-html="hero_lead"></p>
        <div class="cta">
          <a class="btn btn-primary" href="#know" data-i18n="hero_cta1"></a>
          <a class="btn btn-ghost" href="#difficult" data-i18n="hero_cta2"></a>
        </div>
        <div class="stat-row">
          <div class="stat"><b>15</b><span data-i18n="stat1"></span></div>
          <div class="stat"><b>20+</b><span data-i18n="stat2"></span></div>
          <div class="stat"><b>0</b><span data-i18n="stat3"></span></div>
        </div>
      </div>
    </section>

    <div id="groups"></div>
  </main>

  <footer class="footer">
    <div class="wrap">
      <p class="fnote" data-i18n-html="foot_note"></p>
      <p class="fmeta"><a href="../../index.html">rami.party</a> · <span data-i18n="foot_meta"></span> · <span id="year"></span></p>
    </div>
  </footer>

  <script src="library.js"></script>
  <script>
  (function () {
    "use strict";
    const LANGS = ["en", "nl", "fr"];
    // The DISC workshop shipped first with its own key. Read and write both so a
    // language picked anywhere in the library follows the reader everywhere.
    const STORE_KEYS = ["peoplelibrary.lang", "disc.lang"];
    const norm = (r) => { if (!r) return null; const c = String(r).slice(0, 2).toLowerCase(); return LANGS.indexOf(c) !== -1 ? c : null; };

    function fromQuery() { try { return norm(new URLSearchParams(location.search).get("lang")); } catch (e) { return null; } }
    function fromStore() { for (const k of STORE_KEYS) { try { const v = norm(localStorage.getItem(k)); if (v) return v; } catch (e) { return null; } } return null; }
    function fromBrowser() { for (const r of (navigator.languages || [navigator.language])) { const c = norm(r); if (c) return c; } return null; }
    function remember(code) { STORE_KEYS.forEach((k) => { try { localStorage.setItem(k, code); } catch (e) { /* private mode */ } }); }

    const lang = fromQuery() || fromStore() || fromBrowser() || "en";
    if (fromQuery()) remember(lang);

    const T = LIB.T[lang] || LIB.T.en;
    const t = (k) => (k in T ? T[k] : LIB.T.en[k]);

    document.documentElement.lang = lang;
    document.title = t("title");
    document.querySelector('meta[name="description"]').setAttribute("content", t("desc"));
    document.querySelector('meta[property="og:description"]').setAttribute("content", t("desc"));
    document.querySelector('meta[property="og:title"]').setAttribute("content", t("brand"));

    document.querySelectorAll("[data-i18n]").forEach((el) => (el.textContent = t(el.dataset.i18n)));
    document.querySelectorAll("[data-i18n-html]").forEach((el) => (el.innerHTML = t(el.dataset.i18nHtml)));

    // Carry the reader's language into whichever workshop they open.
    const q = "?lang=" + lang;

    document.getElementById("navLinks").innerHTML = LIB.GROUPS
      .map((g) => `<li><a href="#${g}">${t("g_" + g + "_nav")}</a></li>`)
      .join("");

    document.getElementById("groups").innerHTML = LIB.GROUPS
      .map((g) => {
        const cards = LIB.CARDS.filter((c) => c.group === g)
          .map((c) => {
            const d = T.cards[c.id] || LIB.T.en.cards[c.id];
            return `
            <a class="lib-card${c.featured ? " start-here" : ""}" style="--c:${c.c}" href="${c.href}${q}">
              <span class="lib-emoji" aria-hidden="true">${c.icon}</span>
              <span class="lib-body">
                <b>${d.name}</b>
                <small>${d.sub}</small>
                <span class="lib-tag">${d.tag}</span>
              </span>
              <span class="lib-go" aria-hidden="true">→</span>
            </a>`;
          })
          .join("");
        return `
        <section class="group" id="${g}">
          <div class="wrap">
            <div class="group-head">
              <p class="group-kicker">${t("g_" + g + "_kicker")}</p>
              <h2>${t("g_" + g + "_h2")}</h2>
              <p>${t("g_" + g + "_sub")}</p>
            </div>
            <div class="cards">${cards}</div>
          </div>
        </section>`;
      })
      .join("");

    document.querySelectorAll(".lang-switch").forEach((box) => {
      box.setAttribute("aria-label", t("lang_label"));
      box.querySelectorAll("[data-lang]").forEach((btn) => {
        const code = btn.dataset.lang;
        const on = code === lang;
        btn.classList.toggle("on", on);
        btn.setAttribute("aria-pressed", String(on));
        btn.title = LIB.T[code].lang_name;
        btn.addEventListener("click", () => {
          if (code === lang) return;
          remember(code);
          const url = new URL(location.href);
          url.searchParams.set("lang", code);
          location.replace(url.toString());
        });
      });
    });

    document.getElementById("year").textContent = new Date().getFullYear();
  })();
  </script>
</body>
</html>
