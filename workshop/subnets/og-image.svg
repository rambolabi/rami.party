<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Subnet Calculator — rami.party">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0726"/>
      <stop offset="1" stop-color="#06030f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="0.55" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glowA" cx="18%" cy="12%" r="60%">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="88%" cy="90%" r="60%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowA)"/>
  <rect width="1200" height="630" fill="url(#glowB)"/>

  <!-- network glyph -->
  <g transform="translate(120,150)" fill="none" stroke="url(#accent)" stroke-width="10" stroke-linecap="round">
    <circle cx="120" cy="40" r="28" fill="#150a3a"/>
    <circle cx="40" cy="200" r="28" fill="#150a3a"/>
    <circle cx="200" cy="200" r="28" fill="#150a3a"/>
    <path d="M120 68 V150 M120 150 L40 172 M120 150 L200 172"/>
  </g>

  <g font-family="'Segoe UI', system-ui, sans-serif" fill="#ece9ff">
    <text x="430" y="250" font-size="86" font-weight="800" fill="url(#accent)">Subnet Calculator</text>
    <text x="432" y="320" font-size="34" fill="#a99fce">IPv4 · CIDR · netmask · wildcard · hosts</text>
    <text x="432" y="380" font-size="28" fill="#a99fce" font-family="'JetBrains Mono', Consolas, monospace">192.168.1.0/24 → 254 hosts</text>
  </g>

  <text x="120" y="560" font-size="26" fill="#a99fce" font-family="'Segoe UI', system-ui, sans-serif">rami.party · lokaal &amp; privé, geen tracking</text>
</svg>
