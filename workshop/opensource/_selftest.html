<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Open Source Toolkit self-test</title>
</head>

<body>
    <pre id="out">running</pre>
    <iframe id="app" src="./index.html" style="width:1280px;height:900px;border:0"></iframe>
    <script>
        var lines = [];
        function log(s) { lines.push(s); document.getElementById('out').textContent = lines.join('\n'); }
        var wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };

        window.addEventListener('load', function () {
            var frame = document.getElementById('app');
            var w = frame.contentWindow, d = frame.contentDocument;
            (async function () {
                await wait(1200);
                var st = d.createElement('style');
                st.textContent = '*{transition:none !important;animation:none !important}';
                d.head.appendChild(st);
                try { w.localStorage.removeItem('ost.filters'); } catch (e) { }

                var bar = d.getElementById('filterbar');
                var anchor = d.getElementById('toolbarAnchor');
                function snap(tag) {
                    log(tag + ' | closed=' + bar.classList.contains('is-closed') +
                        ' h=' + Math.round(bar.getBoundingClientRect().height) +
                        ' anchorTop=' + Math.round(anchor.getBoundingClientRect().top) +
                        ' y=' + Math.round(w.scrollY) +
                        ' overflow=' + (d.documentElement.scrollWidth - d.documentElement.clientWidth));
                }
                snap('start');
                log('diag | scrollHeight=' + d.documentElement.scrollHeight +
                    ' clientHeight=' + d.documentElement.clientHeight +
                    ' bodyScrollH=' + d.body.scrollHeight +
                    ' htmlOverflowY=' + w.getComputedStyle(d.documentElement).overflowY +
                    ' bodyOverflowY=' + w.getComputedStyle(d.body).overflowY +
                    ' htmlHeight=' + w.getComputedStyle(d.documentElement).height +
                    ' bodyPos=' + w.getComputedStyle(d.body).position);
                w.scrollTo(0, 900); w.dispatchEvent(new Event('scroll')); await wait(120);
                snap('down900');
                w.dispatchEvent(new Event('scroll')); await wait(120);
                snap('settle');
                w.scrollTo(0, 300); w.dispatchEvent(new Event('scroll')); await wait(120);
                snap('up300');
                w.scrollTo(0, 0); w.dispatchEvent(new Event('scroll')); await wait(120);
                snap('top');
                d.getElementById('filtersBtn').click(); await wait(120);
                snap('manualclose');
                w.scrollTo(0, 900); w.dispatchEvent(new Event('scroll')); await wait(120);
                w.scrollTo(0, 0); w.dispatchEvent(new Event('scroll')); await wait(120);
                snap('manualkept');
                log('DONE');
            })();
        });
    </script>
</body>

</html>
