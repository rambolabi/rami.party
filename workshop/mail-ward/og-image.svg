<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Mail Ward — SPF, DKIM and DMARC">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06030f"/>
      <stop offset="1" stop-color="#170a3a"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="0.55" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="150" cy="90" r="330" fill="url(#glow1)"/>
  <circle cx="1080" cy="560" r="320" fill="url(#glow2)"/>

  <g stroke="#ece9ff" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 90 H1200 M0 180 H1200 M0 270 H1200 M0 360 H1200 M0 450 H1200 M0 540 H1200"/>
    <path d="M100 0 V630 M200 0 V630 M300 0 V630 M400 0 V630 M500 0 V630 M600 0 V630 M700 0 V630 M800 0 V630 M900 0 V630 M1000 0 V630 M1100 0 V630"/>
  </g>

  <!-- shield + envelope -->
  <g transform="translate(880 190) scale(1.05)">
    <path d="M110 0 L212 40 v88c0 62-44 99-102 121-58-22-102-59-102-121V40z"
          fill="rgba(168,85,247,0.10)" stroke="#a855f7" stroke-width="7" stroke-linejoin="round"/>
    <rect x="52" y="82" width="116" height="80" rx="10" fill="none" stroke="#22d3ee" stroke-width="7"/>
    <path d="M52 92 l58 44 58-44" fill="none" stroke="#22d3ee" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="80" y="196" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="26" letter-spacing="7" fill="#a99fce">RAMI.PARTY · THE WORKSHOP</text>
  <text x="80" y="308" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="104" font-weight="800" fill="url(#ink)">Mail Ward</text>
  <text x="80" y="374" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="40" font-weight="600" fill="#ece9ff">SPF · DKIM · DMARC, explained properly</text>

  <g font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="25" fill="#a99fce">
    <text x="80" y="440">A safe step-by-step rollout plan · every risk spelled out</text>
    <text x="80" y="482">Record builder &amp; inspector · a runbook for when you are spoofed</text>
  </g>

  <g transform="translate(80 528)">
    <rect x="0" y="0" width="176" height="46" rx="23" fill="rgba(34,211,238,0.16)" stroke="#22d3ee" stroke-width="2"/>
    <text x="88" y="31" text-anchor="middle" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="21" font-weight="700" fill="#22d3ee">v=spf1 -all</text>
    <rect x="196" y="0" width="214" height="46" rx="23" fill="rgba(236,72,153,0.16)" stroke="#ec4899" stroke-width="2"/>
    <text x="303" y="31" text-anchor="middle" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="21" font-weight="700" fill="#ec4899">selector._domainkey</text>
    <rect x="450" y="0" width="180" height="46" rx="23" fill="rgba(168,85,247,0.16)" stroke="#a855f7" stroke-width="2"/>
    <text x="540" y="31" text-anchor="middle" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="21" font-weight="700" fill="#c084fc">p=reject</text>
  </g>
</svg>
