<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Email Volume Dashboard has moved · mail.labidi.eu</title>
    <meta name="description" content="The Email Volume Dashboard — part of Mail Ward — now lives at mail.labidi.eu/volume/.">
    <meta name="theme-color" content="#0d0726">
    <meta name="robots" content="noindex, follow">

    <!-- Mail Ward moved to its own domain on 2026-08-07. No tombstone sw.js:
         no service worker was ever registered under this scope. -->
    <link rel="canonical" href="https://mail.labidi.eu/volume/">
    <meta http-equiv="refresh" content="0; url=https://mail.labidi.eu/volume/">
    <script>
        location.replace('https://mail.labidi.eu/volume/' + location.search + location.hash);
    </script>

    <link rel="stylesheet" href="../../../theme.css">
    <script src="../../../theme.js"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">

    <style>
        body {
            display: grid;
            place-items: center;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
        }

        .moved {
            max-width: 62ch;
        }

        .moved h1 {
            font-family: var(--font-display);
            font-size: clamp(1.8rem, 1.2rem + 2.4vw, 2.6rem);
            background: var(--spell);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .moved p {
            color: var(--text-muted);
            margin-top: 14px;
        }

        .moved .btn-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 26px;
        }
    </style>
</head>

<body>
    <div class="aurora" aria-hidden="true">
        <span class="aurora-blob a1"></span>
        <span class="aurora-blob a2"></span>
        <span class="aurora-blob a3"></span>
    </div>

    <main class="moved">
        <h1>The dashboard has moved</h1>
        <p>The Email Volume Dashboard is now part of <strong>Mail Ward</strong> at its own
            address — it is the tool that finds every system sending mail as your domain.</p>
        <p>You should be sent there automatically.</p>
        <div class="btn-row">
            <a class="btn btn-primary" href="https://mail.labidi.eu/volume/">Go to the dashboard</a>
            <a class="btn btn-ghost" href="https://mail.labidi.eu/">Start with the guide</a>
        </div>
    </main>
</body>

</html>
